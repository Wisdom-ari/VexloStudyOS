name: Build debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --console=plain > build.log 2>&1 || {
            echo "=========== ERRORS ==========="
            grep -nE "^e: |^w: .*error|error:|What went wrong|Execution failed|Could not|Unresolved|FAILED" build.log | head -40
            echo "=========== WHAT WENT WRONG ==========="
            grep -n -A12 "What went wrong" build.log | head -40
            exit 1
          }
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VexloStudyOS-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
